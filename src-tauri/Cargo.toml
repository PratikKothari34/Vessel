[package]
name = "vessel"
version = "1.0.3"
description = "Local roleplay for Windows. Long stories that don't lose the thread."
authors = ["Pratik"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.88"

# The binary is a two-line launcher; the app lives in the lib. That is Tauri's
# own layout, and it is what lets the same `run()` be driven from a desktop
# `main` or a mobile entry point later without moving code.
[lib]
name = "vessel_shell"
path = "src/lib.rs"

[[bin]]
name = "vessel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# The whole application. This crate is the desktop shell and nothing else: it
# owns the window, the command surface and the event channels, and defers every
# decision about the user's data to the core.
vessel-core = { path = "../src-core" }

# No extra features: avatars are remote URLs or data: URIs (capped at 4096 in
# characters.rs), never local files, so the asset protocol stays off.
tauri = { version = "2.11.5" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
