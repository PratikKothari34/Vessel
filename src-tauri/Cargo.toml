[package]
name = "vessel"
version = "1.0.3"
description = "Local roleplay for Windows. Long stories that don't lose the thread."
authors = ["Pratik"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.88"

# The binary is a two-line launcher; the app lives in the lib. That is Tauri's
# own layout, and it is what lets the same `run()` be driven from a desktop
# `main` or a mobile entry point later without moving code.
[lib]
name = "vessel_shell"
path = "src/lib.rs"

[[bin]]
name = "vessel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# The whole application. This crate is the desktop shell and nothing else: it
# owns the window, the command surface and the event channels, and defers every
# decision about the user's data to the core.
vessel-core = { path = "../src-core" }

# No extra features here: avatars are remote URLs or data: URIs (capped at 4096
# in characters.rs), never local files, so the asset protocol stays off.
# `custom-protocol` is wired through the `bundled-ui` feature below rather than
# turned on unconditionally - see that feature for why.
tauri = { version = "2.11.5" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1.0"
# Only for join_all: a character delete takes every one of its conversation
# locks concurrently, never one after another.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []

# Serve the renderer from `frontendDist` instead of `devUrl`.
#
# `tauri.conf.json` names both a `devUrl` (the Vite server on :5173) and a
# `frontendDist` (`app/out/renderer`, already built). Which one the binary uses
# is decided AT COMPILE TIME, and not by the cargo profile: tauri's build script
# computes `dev = !custom_protocol` (tauri-2.11.5/build.rs:257) and passes it to
# `tauri_build` as `DEP_TAURI_DEV`. So without this feature even
# `cargo build --release` bakes in the dev URL, and the window opens on
# ERR_CONNECTION_REFUSED unless a Vite server happens to be running.
#
# The `cargo tauri` CLI sets this itself, which is why the trap only shows up
# when building with plain cargo - which is what this repo does, since the
# renderer is prebuilt and there is no tauri-cli installed.
#
# Left OFF by default so `cargo build` keeps the hot-reload workflow.
bundled-ui = ["tauri/custom-protocol"]
